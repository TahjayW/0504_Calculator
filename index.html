<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
//Displaying Number in Flex Container

<div class="Calc Case">
    <div class= "display">
        <div class="displayDigit1"></div>
        <div class="displayDigit2"></div>
        <div class="displayDigit3"></div>
        <div class="displayDigit4"></div>
    </div>

    <div class="operandContainer">
        <div class = "add">+</div>
        <div class = "subtract">-</div>
        <div class = "multiply">*</div>
        <div class = "divide">/</div>
    </div>  

    <div class="equals"> = </div>

    <div class="numberContainer">
        <div class="number1">1</div>
        <div class="number2">2</div>
        <div class="number3">3</div>
        <div class="number4">4</div>
        <div class="number5">5</div>
        <div class="number6">6</div>
        <div class="number7">7</div>
        <div class="number8">8</div>
        <div class="number9">9</div>
        <div class="number0">0</div>
</div>





</body>
</html>
