<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- /*Displaying Number in Flex Container*/ -->

    <div class="CalcCase">
        <div class="display">
            <div class="displayDigit" id="0"></div>
            <div class="displayDigit" id="1"></div>
            <div class="displayDigit" id="2"></div>
            <div class="displayDigit" id="3"></div>
            <div class="displayDigit" id="4"></div>
            <div class="displayDigit" id="5"></div>
            <div class="displayDigit" id="6"></div>
            <div class="displayDigit" id="7"></div>
            <div class="displayDigit" id="8"></div>
            <div class="displayDigit" id="9"></div>
        </div>




        <div class="buttonContainer">
            <div class="operandContainer">
                <div class="operand" id="add">+</div>
                <div class="operand" id="subtract">-</div>
                <div class="operand" id="multiply">*</div>
                <div class="operand" id="divide">/</div>
                <div class="operand" id="equals"> = </div>
            </div>

            <div class="numberContainer">
                <div class="numberBtn" id="num1">1</div>
                <div class="numberBtn" id="num2">2</div>
                <div class="numberBtn" id="num3">3</div>
                <div class="numberBtn" id="num4">4</div>
                <div class="numberBtn" id="num5">5</div>
                <div class="numberBtn" id="num6">6</div>
                <div class="numberBtn" id="num7">7</div>
                <div class="numberBtn" id="num8">8</div>
                <div class="numberBtn" id="num9">9</div>
                <div class="numberBtn" id="num0">0</div>
            </div>

        </div>

    </div>
</body>

</html>
