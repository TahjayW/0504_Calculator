<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
//Displaying Number in Flex Container

<div class="Calc Case">
    <div class= "display">
        <div class ="displayDigit" id="0"></div>
        <div class ="displayDigit" id="1"></div>
        <div class ="displayDigit" id="2"></div>
        <div class ="displayDigit" id="3"></div>
        <div class ="displayDigit" id="4"></div>
        <div class ="displayDigit" id="5"></div>
        <div class ="displayDigit" id="6"></div>
        <div class ="displayDigit" id="7"></div>
        <div class ="displayDigit" id="8"></div>
        <div class ="displayDigit" id="9"></div>

    </div>

    <div class="operandContainer">
       <div class = "operand" id="add">+</div>
       <div class = "operand" id="subtract">-</div>
       <div class = "operand" id="multiply">*</div>
       <div class = "operand" id="divide">/</div>
    </div>  

    <div class="equals"> = </div>

    <div class="numberContainer">
        <div class="number1">1</div>
        <div class="number2">2</div>
        <div class="number3">3</div>
        <div class="number4">4</div>
        <div class="number5">5</div>
        <div class="number6">6</div>
        <div class="number7">7</div>
        <div class="number8">8</div>
        <div class="number9">9</div>
        <div class="number0">0</div>
</div>
</body>
</html>
