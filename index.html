<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="0504_Calculator.js" defer></script>

</head>

<body>
    <div class="case">
        <div class="upperDisplay"></div>
        <div class="lowerDisplay">
            <!--top four button should be operands-->
            <div class="topRow">
                <div class="operator" id="plus"></div>
                <div class="operator" id="minus"></div>
                <div class="operator" id="multiply"></div>
                <div class="operator" id="divide"></div>
            </div>
            <!--bottomRowLeft contains the numbers, right contains the clear and enter operations-->
            <!--Bottom two rows are in a flex container, direction row-->

            <div class="bottomRowBothSides">
                <div class="bottomRowLeft">
                    <div class="btnNumber" id="1">1</div>
                    <div class="btnNumber" id="2">2</div>
                    <div class="btnNumber" id="3">3</div>
                    <div class="btnNumber" id="4">4</div>
                    <div class="btnNumber" id="5">5</div>
                    <div class="btnNumber" id="6">6</div>
                    <div class="btnNumber" id="7">7</div>
                    <div class="btnNumber" id="8">8</div>
                    <div class="btnNumber" id="9">9</div>
                    <div class="btnNumber" id="num0">0</div>
                </div>

                <div class="bottomRowRight">
                    <div class="equals">=</div>
                    <div class="clear">CLR</div>
                </div>
            </div>

        </div>









    </div>
</body>

</html>
